; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32ota
src_dir = .
data_dir = data

; put the files to upload in MCU filesystem in the data direcotry

[common]
hostname    = esp32_19
fqdn        = ${common.hostname}.local
platform    = espressif32 @ 6.13.0
board       = esp32dev
framework = arduino
platform_packages =
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
build_flags = 
	-I include
	-D IGNORE_SENSORS
	-D LV_LVGL_H_INCLUDE_SIMPLE
	; Backlight controlled via LEDC PWM in main.cpp, not by TFT_eSPI
	;-D TFT_BL=21
	;-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_SPIRAM_CACHE_WORKAROUND
	-DHOSTNAME=\"${common.hostname}\"
	-D IS_ESP32_CYD_28
	#-DENABLE_QRreader
	-DNET_WATCHDOG=\"192.168.1.1\"
	-DUSE_TPL_SD
	#-DBOARD=ESP32_CAM
#-DNO_NET_WATCHDOG=1
#-DBOTtoken=Heizung_BOTtoken
#-Wstack-usage=310
# -DBOARD_HAS_PSRAM part of esp32cam extra flags
# -mfix-esp32-psram-cache-issue part of esp32cam extra flags
#    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=5
lib_deps = 
	lvgl/lvgl@^9.1.0
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git@1.4
	bblanchon/ArduinoJson@^6.17.2
	# WebSockets
	549@^2.2.1
extra_scripts = 
	pre:../prj_template/tools/generate_version.py


[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
lib_deps = 
	${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
upload_protocol = espota
upload_port = ${common.fqdn}
upload_flags =
    --port=3232
	--host_port=56789

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
lib_deps = 
	${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = 115200
#upload_speed = 921600
upload_speed = 115200
upload_port = /dev/tty.usbserial-83310

