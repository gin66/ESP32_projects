; PlatformIO Project Configuration File
;
;   26_CYD_CAN_monitor - CYD ESP32 CAN Bus Monitor with LVGL Display
;
;   Two CYD boards connected via CAN bus (SN65HVD230/232 transceivers,
;   120 Ohm termination). Each board uses its WiFi IP last byte as
;   CAN identifier to exchange time data and display received messages.
;
;   CAN pins: RX=GPIO27, TX=GPIO22
;   Baud rate: 125 kbps (standard CAN, CAN-FD not yet verified)
;   Board: 2.8" Cheap Yellow Display (ILI9341 + XPT2046)
;
;   Upload port: Update upload_port in [env:esp32usb] for your device.
;   Find it with: ls /dev/tty.usbserial*  (macOS) or dmesg (Linux)

[platformio]
default_envs = esp32_35_usb
src_dir = .
data_dir = data

[common]
hostname    = esp32_26
fqdn        = ${common.hostname}.local
platform    = espressif32 @ 6.13.0
board       = esp32dev
framework   = arduino
platform_packages =
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
build_flags =
	-I include
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_SPIRAM_CACHE_WORKAROUND
	-DHOSTNAME=\"${common.hostname}\"
	-DNET_WATCHDOG=\"192.168.1.1\"
	-D MAX_CAN_MESSAGES=50
	-Werror
	; ------------------------------------------------------------------
	; TFT_eSPI board configuration — taken verbatim from the known-good
	; boilerplate (commit 92541da, 19_CYD-project). Do not "tidy" these:
	; USER_SETUP_LOADED stops TFT_eSPI pulling in its own User_Setup.h,
	; which is an ESP8266/NodeMCU default (DC ends up on GPIO0).
	; USE_HSPI_PORT puts the display on SPI2, so the XPT2046 uses SPI3/VSPI.
	; TFT_RST=-1 because the panel's reset pin is not connected on this board.
	; Driver, geometry and backlight pin are per-env (2.8" ILI9341 vs 3.5"
	; ST7796) — defining them twice trips -Werror.
	; ------------------------------------------------------------------
	-D USER_SETUP_LOADED
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1     ; not connected on this board
	-D LOAD_GLCD=1
	-D TOUCH_CS=33
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D SMOOTH_FONT
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT
	-D TFT_BACKLIGHT_ON=HIGH
lib_deps = 
	lvgl/lvgl@~9.2.0     ; 9.2 is the first release with working lv_display_set_rotation()
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git@1.4
	bblanchon/ArduinoJson@^6.17.2
	# WebSockets
	549@^2.2.1
extra_scripts = 
	pre:../prj_template/tools/generate_version.py

[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D IS_ESP32_CYD_28
	-D ILI9341_2_DRIVER
	-D TFT_BL=21
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_ROTATION=3
	-D CAN_TX_PIN=22
	-D CAN_RX_PIN=27
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
upload_protocol = espota
upload_port = ${common.fqdn}
upload_flags =
    --port=3232
	--host_port=56789

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D IS_ESP32_CYD_28
	-D ILI9341_2_DRIVER
	-D TFT_BL=21
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_ROTATION=3
	-D CAN_TX_PIN=22
	-D CAN_RX_PIN=27
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = 115200
upload_speed = 460800
# TODO: Update this to your CYD's serial port.
# Find it with: ls /dev/tty.usbserial*  (macOS) or dmesg (Linux)
upload_port = /dev/tty.usbserial-????

[env:esp32_35_usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D TFT_ROTATION=0
	-D CAN_RX_PIN=21
	-D IS_ESP32_CYD_35
	-D ST7796_DRIVER
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_RST=-1
	-D TFT_BL=27
	; Raw Y runs opposite to the panel, so the range is inverted to keep
	; top/bottom the right way up. X needs no such flip.
	-Wno-cpp
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/tty.usbserial-????
