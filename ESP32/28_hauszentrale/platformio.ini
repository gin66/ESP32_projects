[platformio]
default_envs = esp32usb
src_dir = .
data_dir = data

[common]
hostname    = hauszentrale
fqdn        = ${common.hostname}.local
platform    = espressif32 @ 6.13.0
board       = esp32-s3-devkitc-1
framework   = arduino
build_flags =
    -I include
    -DHOSTNAME=\"${common.hostname}\"
    -DCORE_DEBUG_LEVEL=1
    -DIS_WAVESHARE_LCD7
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNO_NET_WATCHDOG
extra_scripts = pre:../prj_template/tools/generate_version.py
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	links2004/WebSockets@^2.2.1

[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.partitions = custom_16m_ota.csv
board_build.flash_size = 16MB
board_build.filesystem = spiffs
upload_protocol = espota
upload_port = ${common.fqdn}
upload_flags =
    --port=3232
    --host_port=56789
monitor_speed = 115200

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.partitions = custom_16m_ota.csv
board_build.flash_size = 16MB
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5C941561291
