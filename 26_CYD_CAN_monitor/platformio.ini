; PlatformIO Project Configuration File
;
;   26_CYD_CAN_monitor - CYD ESP32 CAN Bus Monitor with LVGL Display
;
;   Two CYD boards connected via CAN bus (SN65HVD230/232 transceivers,
;   120 Ohm termination). Each board uses its WiFi IP last byte as
;   CAN identifier to exchange time data and display received messages.
;
;   CAN pins: RX=GPIO27, TX=GPIO22
;   Baud rate: 125 kbps (standard CAN, CAN-FD not yet verified)
;   Board: 2.8" Cheap Yellow Display (ILI9341 + XPT2046)
;
;   Upload port: Update upload_port in [env:esp32usb] for your device.
;   Find it with: ls /dev/tty.usbserial*  (macOS) or dmesg (Linux)

[platformio]
default_envs = esp32_35_usb
src_dir = .
data_dir = data

[common]
hostname    = esp32_26
fqdn        = ${common.hostname}.local
platform    = espressif32 @ 6.13.0
board       = esp32dev
framework   = arduino
platform_packages =
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
build_flags =
	-I include
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D LOAD_GLCD=1
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_SPIRAM_CACHE_WORKAROUND
	-DHOSTNAME=\"${common.hostname}\"
	-DNET_WATCHDOG=\"192.168.1.1\"
	-D MAX_CAN_MESSAGES=50
lib_deps = 
	lvgl/lvgl@^9.1.0
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git@1.4
	bblanchon/ArduinoJson@^6.17.2
	# WebSockets
	549@^2.2.1
extra_scripts = 
	pre:../prj_template/tools/generate_version.py

[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D IS_ESP32_CYD_28
	-D TFT_ROTATION=3
	-D CAN_TX_PIN=22
	-D CAN_RX_PIN=27
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
upload_protocol = espota
upload_port = ${common.fqdn}
upload_flags =
    --port=3232
	--host_port=56789

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D IS_ESP32_CYD_28
	-D TFT_ROTATION=3
	-D CAN_TX_PIN=22
	-D CAN_RX_PIN=27
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = 115200
upload_speed = 460800
# TODO: Update this to your CYD's serial port.
# Find it with: ls /dev/tty.usbserial*  (macOS) or dmesg (Linux)
upload_port = /dev/tty.usbserial-????

[env:esp32_35_usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags =
	${common.build_flags}
	-D TFT_ROTATION=0
	-D CAN_RX_PIN=21
	-D IS_ESP32_CYD_35
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	; Raw Y runs opposite to the panel, so the range is inverted to keep
	; top/bottom the right way up. X needs no such flip.
	-Wno-cpp
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/tty.usbserial-????
