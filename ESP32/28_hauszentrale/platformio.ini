[platformio]
default_envs = esp32ota
src_dir = src
data_dir = data

[common]
hostname    = hauszentrale
fqdn        = ${common.hostname}.local
; Official espressif32 8.0.0: Arduino 3.3.12 on ESP-IDF 5.5, which has the
; RGB num_fbs and bounce buffer support. Other projects stay on 6.13.0.
platform    = platformio/espressif32@8.0.0
board       = waveshare_esp32_s3_touch_lcd_7
framework   = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB          ; measured, §3.1.1 — the part is 16 MB, not 8 MB
board_build.arduino.memory_type = qio_opi   ; quad flash (Winbond 4018) + octal PSRAM
board_build.filesystem = spiffs
board_upload.flash_size = 16MB
board_build.partitions = partitions_16m.csv 
platform_packages =
build_flags =
    -I include
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_KCONFIG_IGNORE            ; use include/lv_conf.h, skip esp_attr.h in .S files
    -DHOSTNAME=\"${common.hostname}\"
    -DNO_NET_WATCHDOG             ; WiFi is optional; never reboot on a lost AP
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DARDUINO_USB_CDC_ON_BOOT=0     ; Serial is UART0, GPIO 43/44, the CH9102
    -DARDUINO_USB_MODE=0            ; no USB-OTG CDC; GPIO 19/20 belong to TWAI
    -DIS_WAVESHARE_LCD7
    -DTPL_WS7_ROTATION=0          ; portrait: 480 x 800 logical
    -DTPL_WS7_DRAW_LINES=10
    -DTPL_WS7_BOUNCE_LINES=10
    -DTPL_WS7_TOUCH_X_OFFSET=-1   ; GT911 calibration 2026-10-18
    -DTPL_WS7_TOUCH_Y_OFFSET=5    ; GT911 calibration 2026-10-18
    -DTPL_WS7_PCLK_HZ=12000000    ; ~29 Hz scanout; no video, 16 MHz ran ~39 Hz
    -DUSE_TPL_DEBUG_LOG
    -DDEBUG_LOG_BYTES=1048576     ; 1 MB PSRAM byte ring
    -DDEBUG_LOG_SERIAL=1          ; mirror to Serial while it is usable
build_src_flags = -Werror
build_unflags = -DARDUINO_USB_MODE=1    ; board manifest defaults to USB-OTG mode
extra_scripts = pre:../prj_template/tools/generate_version.py
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	links2004/WebSockets@^2.2.1
	lvgl/lvgl@~9.2.0
	git+https://github.com/volkszaehler/libsml
; The template's tpl_matter.h mentions <Matter.h> inside an #ifdef, but the
; PlatformIO dependency finder scans textually and would otherwise link the
; whole Arduino Matter stack (~40 KB of internal .bss) into every project.
lib_ignore = Matter

[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.flash_size = ${common.board_build.flash_size}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
board_upload.flash_size = ${common.board_upload.flash_size}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
extra_scripts = ${common.extra_scripts}
upload_protocol = espota
upload_port = ${common.hostname}.fritz.box
upload_flags =
    --port=3232
    --host_port=56789
monitor_speed = 115200

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.flash_size = ${common.board_build.flash_size}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
board_upload.flash_size = ${common.board_upload.flash_size}
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
extra_scripts = ${common.extra_scripts}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_flags = ${common.build_src_flags}
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200