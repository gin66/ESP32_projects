; PlatformIO Project Configuration File
;
;   27_cyd_starter — Minimal CYD board abstraction demo
;
;   This is a standalone demo — no full template stack required.
;   It demonstrates the tpl_display CYD board abstraction layer.

[platformio]
default_envs = esp32ota
src_dir = .
data_dir = data

[common]
hostname    = esp32_27
platform    = espressif32 @ 6.13.0
board       = esp32dev
framework   = arduino
board_build.f_cpu = 240000000L
build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LOAD_GLCD=1
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_SPIRAM_CACHE_WORKAROUND
	-D IS_ESP32_CYD_28
	-D TOUCH_CS=33
	-D TFT_ROTATION=3
lib_deps =
	lvgl/lvgl@^9.1.0
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git@1.4

[env:esp32ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
upload_protocol = espota
upload_port = ${common.hostname}.local

[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
board_build.f_cpu = ${common.board_build.f_cpu}
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/tty.usbserial-????
