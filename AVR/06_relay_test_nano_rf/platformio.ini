; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328new]
platform = atmelavr
framework = arduino
board = nanoatmega328new
#board = nanoatmega328
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
build_flags = -I$HOME/src/.private
lib_deps =
	Wire
	solderedelectronics/Soldered nRF24 Library
	PaulStoffregen/OneWire
	wollewald/ADS1115_WE
	#matmunk/DS18B20@^1.0.0
	#autowp/autowp-mcp2515
# using optiboot
upload_protocol = stk500v1
upload_flags = -P$UPLOAD_PORT -b$UPLOAD_SPEED

upload_port = /dev/cu.usbserial-14140
upload_speed = 57600
#upload_port = /dev/tty.usbserial-14110
